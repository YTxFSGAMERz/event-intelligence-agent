name: Event Intelligence Agent

on:
  push:
    branches: [main]
    # Code/config updates trigger a scan; data/seen_events.json is intentionally excluded
    # to prevent the agent's own state commits from starting another run.
    paths:
      - ".github/workflows/monitor.yml"
      - "main.py"
      - "opportunity_quality.py"
      - "source_adapters.py"
      - "page_verification.py"
      - "tests/**"
      - "requirements.txt"
      - "sources.txt"
      - "dashboard/**"
  schedule:
    # Every 15 minutes, UTC. GitHub scheduling is best-effort, not a guaranteed exact timer.
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      send_test_alert:
        description: "Send a Telegram connectivity test before scanning"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: event-intelligence-agent
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate opportunity schema
        run: python -m unittest discover -s tests -v

      - name: Test Telegram delivery (optional manual run)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.send_test_alert }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import sys
          import requests

          token = os.getenv("TELEGRAM_BOT_TOKEN", "").strip()
          chat_id = os.getenv("TELEGRAM_CHAT_ID", "").strip()
          if not token or not chat_id:
              print("Telegram secrets are missing: check TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID.", file=sys.stderr)
              raise SystemExit(1)

          try:
              response = requests.post(
                  f"https://api.telegram.org/bot{token}/sendMessage",
                  json={
                      "chat_id": chat_id,
                      "text": "✅ Event Intelligence Agent: GitHub Actions can reach Telegram.",
                      "disable_web_page_preview": True,
                  },
                  timeout=15,
              )
              payload = response.json()
          except requests.RequestException as exc:
              print(f"Telegram request failed ({type(exc).__name__}).", file=sys.stderr)
              raise SystemExit(1)
          except ValueError:
              print("Telegram returned a non-JSON response.", file=sys.stderr)
              raise SystemExit(1)

          if not response.ok or not payload.get("ok"):
              code = payload.get("error_code", response.status_code)
              description = payload.get("description", "Telegram did not confirm delivery")
              print(f"Telegram API error {code}: {description}", file=sys.stderr)
              raise SystemExit(1)

          print("Telegram connectivity test passed; Telegram accepted the test message.")
          PY

      - name: Check deployed dashboard
        run: |
          python - <<'PY'
          import sys
          import urllib.error
          import urllib.request

          url = "https://event-intelligence-dashboard-indol.vercel.app/"
          request = urllib.request.Request(
              url,
              headers={"User-Agent": "event-intelligence-agent-healthcheck/1.0"},
          )
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  status = response.status
                  content_type = response.headers.get("Content-Type", "")
                  body = response.read(1000000).decode("utf-8", errors="replace").lower()
          except (urllib.error.URLError, TimeoutError) as exc:
              print(f"Dashboard health check failed: {type(exc).__name__}", file=sys.stderr)
              raise SystemExit(1)

          if status != 200:
              print(f"Dashboard returned HTTP {status}", file=sys.stderr)
              raise SystemExit(1)
          if "text/html" not in content_type.lower() or "<html" not in body:
              print("Dashboard did not return an HTML page.", file=sys.stderr)
              raise SystemExit(1)

          print(f"Dashboard health check passed (HTTP {status}).")
          PY

      - name: Scan configured feeds
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Persist deduplication state
        if: always()
        run: |
          if [[ -n "$(git status --porcelain data/seen_events.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            # Preserve this run's discoveries, then merge them with the latest remote state.
            cp data/seen_events.json /tmp/local_seen_events.json
            for attempt in 1 2 3; do
              git fetch origin main
              git show origin/main:data/seen_events.json > /tmp/remote_seen_events.json
              python - <<'PY'
          import json
          from pathlib import Path

          local_path = Path("/tmp/local_seen_events.json")
          remote_path = Path("/tmp/remote_seen_events.json")
          local_state = json.loads(local_path.read_text(encoding="utf-8"))
          remote_state = json.loads(remote_path.read_text(encoding="utf-8"))
          merged = dict(remote_state)
          merged_seen = dict(remote_state.get("seen") or {})
          local_seen = local_state.get("seen") or {}

          for event_id, local_event in local_seen.items():
              remote_event = merged_seen.get(event_id, {})
              combined = dict(remote_event)
              combined.update(local_event)
              for field in ("first_seen_utc",):
                  values = [value for value in (remote_event.get(field), local_event.get(field)) if value]
                  if values:
                      combined[field] = min(values)
              for field in ("last_seen_utc",):
                  values = [value for value in (remote_event.get(field), local_event.get(field)) if value]
                  if values:
                      combined[field] = max(values)
              merged_seen[event_id] = combined

          merged["seen"] = merged_seen

          # Merge source-run health separately so successful fetch timestamps and
          # failure streaks survive the same optimistic state merge as event records.
          merged_health = dict(remote_state.get("source_health") or {})
          local_health = local_state.get("source_health") or {}
          for source_id, local_record in local_health.items():
              remote_record = merged_health.get(source_id, {})
              combined = dict(remote_record)
              combined.update(local_record)
              for field in ("last_attempt_at", "last_success_at"):
                  values = [value for value in (
                      remote_record.get(field), local_record.get(field)
                  ) if value]
                  if values:
                      combined[field] = max(values)
              merged_health[source_id] = combined
          merged["source_health"] = merged_health

          timestamps = [value for value in (
              remote_state.get("updated_utc"), local_state.get("updated_utc")
          ) if value]
          if timestamps:
              merged["updated_utc"] = max(timestamps)

          Path("/tmp/merged_seen_events.json").write_text(
              json.dumps(merged, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          PY
              # Reset the index to the current main branch; stage only the merged state file.
              git reset --mixed origin/main
              cp /tmp/merged_seen_events.json data/seen_events.json
              git add data/seen_events.json
              if git diff --cached --quiet; then
                echo "Tracking state is already up to date."
                break
              fi
              git commit -m "chore: merge event tracking state [skip ci]"
              if git push; then
                echo "Tracking state saved."
                break
              fi
              if [[ "$attempt" -eq 3 ]]; then
                echo "Could not save tracking state after 3 attempts." >&2
                exit 1
              fi
              echo "Remote changed during state save; retrying merge (attempt $((attempt + 1)))."
            done
          fi
